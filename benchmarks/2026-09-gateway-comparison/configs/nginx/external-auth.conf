# Nginx external-auth scenario (scenario: auth/nginx/auth_request).
# auth_request issues an internal subrequest to the auth service. The request body is not
# forwarded (proxy_pass_request_body off) because the benchmark only measures the extra
# auth hop, not request payload handling.
worker_processes 2;
events { worker_connections 8192; }
http {
  access_log off;
  upstream backend_up { server backend:80; keepalive 256; }
  upstream auth_up { server auth:80; keepalive 256; }
  server {
    listen 80;
    location = /_auth {
      internal;
      proxy_pass http://auth_up/;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }
    location / {
      auth_request /_auth;
      proxy_pass http://backend_up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }
  }
}
