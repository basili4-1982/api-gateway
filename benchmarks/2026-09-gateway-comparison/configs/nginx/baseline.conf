# Nginx proxy-only baseline (scenarios: proxy-only / proxy-memory).
# worker_processes 2 matches the two pinned gateway CPUs; access_log off keeps logging
# off the hot path; keepalive 256 avoids connection setup per upstream request.
worker_processes 2;
events { worker_connections 8192; }
http {
  access_log off;
  upstream backend_up {
    server backend:80;
    keepalive 256;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://backend_up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
    }
  }
}
