name: Lint and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        id: lint
        continue-on-error: true
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          golangci-lint run ./... --output.json.path=lint-report.json --issues-exit-code 0

      - name: Create/update lint issue
        run: |
          type gh &>/dev/null || sudo apt-get install -y -qq gh
          scripts/lint-to-issues.sh

      - name: Fail on lint errors
        if: steps.lint.outcome != 'success'
        run: |
          echo "❌ Lint errors found. Issue created/updated."
          exit 1

      - name: Govulncheck
        uses: kmulvey/govulncheck-action@v1.5.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go test
        run: go test ./... -count=1
