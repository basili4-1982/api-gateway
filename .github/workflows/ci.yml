name: Lint and Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint + issue
        id: lint
        continue-on-error: true
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --out-format json --issues-exit-code 0

      - name: Create/update lint issue
        run: scripts/lint-to-issues.sh

      - name: Fail on lint errors
        if: steps.lint.outcome != 'success'
        run: |
          echo "❌ Lint errors found. Issue created/updated."
          exit 1

      - name: Govulncheck
        uses: kmulvey/govulncheck-action@v1.5.0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go test
        run: go test ./... -count=1
