server:
  port: 80
  read_timeout: 5s
  write_timeout: 30s
  idle_timeout: 120s

application:
  env: "prod"
  health_check: false
  circuit_breaker: false

static:
  skip_prefixes:
    - "/api"
  apps:
    - path_prefix: "/"
      root_dir: "/app/static"
      index_file: "index.html"
      max_age: 3600

jwt:
  required: false
  secret_key: "your-secret-key-change-in-production"
  validate_exp: false
  claim_mappings:
    - "id"
    - "email"
    - "roles"

targets:
  - name: "frontend"
    url: "http://frontend:3000"
    timeout: 30s

  - name: "chatcom"
    url: "http://chatcom:8086"
    timeout: 30s

  - name: "account"
    url: "http://account:8081"
    timeout: 30s

  - name: "cart"
    url: "http://cart:8082"
    timeout: 30s

  - name: "payment"
    url: "http://payment:8083"
    timeout: 30s

  - name: "catalog"
    url: "http://catalog:8084"
    timeout: 30s

  - name: "blog"
    url: "http://blog:8085"
    timeout: 30s

routing:
  # chatcom.sarnas.ru → всё на chatcom
  - host: "chatcom.sarnas.ru"
    path_prefix: "/"
    target_name: "chatcom"

  # sarnas.com API → микросервисы
  - path_prefix: "/api/chatcom"
    target_name: "chatcom"

  - path_prefix: "/api/account"
    target_name: "account"

  - path_prefix: "/api/cart"
    target_name: "cart"

  - path_prefix: "/api/payment"
    target_name: "payment"

  - path_prefix: "/api/catalog"
    target_name: "catalog"

  - path_prefix: "/api/blog"
    target_name: "blog"

  # sarnas.com → Next.js (не-статик роуты проксируются)
  - path_prefix: "/"
    target_name: "frontend"

headers:
  cors:
    enabled: true
    allowed_origins: ["*"]
    allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS", "HEAD"]
    allowed_headers: ["Origin", "Content-Type", "Accept", "Authorization", "X-Request-ID"]
    expose_headers: ["X-Request-ID", "Content-Disposition"]
    max_age: 86400

logging:
  level: "info"
  format: "console"
